name: Deploy MCP Portal to Azure
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          az acr login -n cidefprodacr
          docker build -f Dockerfile.azure -t cidefprodacr.azurecr.io/mcp-portal:${{ github.sha }} .
          docker push cidefprodacr.azurecr.io/mcp-portal:${{ github.sha }}
      - name: Confirm image published
        run: az acr repository show-tags --name cidefprodacr --repository mcp-portal --output table
      - name: Deploy existing Container App
        shell: bash
        run: |
          set -euo pipefail
          az containerapp show --resource-group rg-cidef-prod --name mcp-portal >/dev/null
          az containerapp update --resource-group rg-cidef-prod --name mcp-portal \
            --image cidefprodacr.azurecr.io/mcp-portal:${{ github.sha }}
          FQDN=$(az containerapp show --resource-group rg-cidef-prod --name mcp-portal --query 'properties.configuration.ingress.fqdn' -o tsv)
          test -n "$FQDN"
          for attempt in $(seq 1 12); do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$FQDN/api/mcp" || true)
            if [ "$STATUS" = "401" ]; then echo "MCP auth enforcement verified"; exit 0; fi
            sleep 10
          done
          echo "Expected 401 from protected endpoint; got $STATUS" >&2
          exit 1
