name: Deploy MCP Portal to Azure
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and publish
        shell: bash
        run: |
          set -euo pipefail
          az acr login -n cidefprodacr
          docker build -f Dockerfile.azure -t cidefprodacr.azurecr.io/mcp-portal:${{ github.sha }} .
          docker push cidefprodacr.azurecr.io/mcp-portal:${{ github.sha }}
      - name: Confirm image published
        run: az acr repository show-tags --name cidefprodacr --repository mcp-portal --output table
